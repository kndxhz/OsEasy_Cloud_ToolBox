name: Build and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    name: Build Release
    runs-on: windows-latest

    steps:
      # ========================================
      # 1. Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ========================================
      # 2. 检查 Commit Message
      # ========================================
      - name: Check release commit
        id: release
        shell: pwsh
        run: |
          $commitMessage = @"
          ${{ github.event.head_commit.message }}
          "@

          Write-Host "Commit message:"
          Write-Host $commitMessage

          # 匹配：
          # release: v2.1.4.1
          # release: v1.0.0.0
          #
          # 允许 commit message 前后存在其他内容
          $match = [regex]::Match(
              $commitMessage,
              '(?im)release:\s*v(\d+\.\d+\.\d+\.\d+)'
          )

          if (-not $match.Success) {
              Write-Host "Commit 不包含 release: vx.x.x.x"
              Write-Host "跳过 Release。"

              "is_release=false" >> $env:GITHUB_OUTPUT
              exit 0
          }

          $version = $match.Groups[1].Value
          $tag = "v$version"

          Write-Host "检测到 Release："
          Write-Host "Version = $version"
          Write-Host "Tag     = $tag"

          "is_release=true" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      # ========================================
      # 3. 修改 AssemblyInfo.cs
      # ========================================
      - name: Update AssemblyInfo version
        if: steps.release.outputs.is_release == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $file = "OsEasy_Cloud_ToolBox/Properties/AssemblyInfo.cs"
          $version = $env:VERSION

          if (-not (Test-Path $file)) {
              throw "找不到 $file"
          }

          Write-Host "修改版本号为 $version"

          $content = Get-Content $file -Raw

          # AssemblyVersion
          $content = $content -replace `
              '\[assembly:\s*AssemblyVersion\(".*?"\)\]', `
              "[assembly: AssemblyVersion(`"$version`")]"

          # AssemblyFileVersion
          $content = $content -replace `
              '\[assembly:\s*AssemblyFileVersion\(".*?"\)\]', `
              "[assembly: AssemblyFileVersion(`"$version`")]"

          Set-Content `
              -Path $file `
              -Value $content `
              -Encoding UTF8

          Write-Host ""
          Write-Host "修改后的版本信息："

          Select-String `
              -Path $file `
              -Pattern 'AssemblyVersion|AssemblyFileVersion'

      # ========================================
      # 4. 设置 MSBuild
      # ========================================
      - name: Setup MSBuild
        if: steps.release.outputs.is_release == 'true'
        uses: microsoft/setup-msbuild@v2

      # ========================================
      # 5. 构建 Release | AnyCPU
      # ========================================
      - name: Build Release
        if: steps.release.outputs.is_release == 'true'
        shell: pwsh
        run: |
          Write-Host "开始构建 Release | AnyCPU..."

          msbuild `
            OsEasy_Cloud_ToolBox.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=AnyCPU

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild 构建失败"
          }

          Write-Host ""
          Write-Host "MSBuild 构建成功。"

      # ========================================
      # 6. 查找 EXE
      # ========================================
      - name: Locate executable
        if: steps.release.outputs.is_release == 'true'
        id: exe
        shell: pwsh
        run: |
          $releaseDir = "OsEasy_Cloud_ToolBox/bin/Release"

          if (-not (Test-Path $releaseDir)) {
              throw "Release 目录不存在：$releaseDir"
          }

          Write-Host "Release 目录：$releaseDir"
          Write-Host ""
          Write-Host "Release 目录内容："

          Get-ChildItem `
              $releaseDir `
              -Recurse `
              -File |
              Select-Object FullName, Length

          # ========================================
          # 查找 EXE
          # ========================================
          $exes = @(
              Get-ChildItem `
                  $releaseDir `
                  -Filter "*.exe" `
                  -Recurse `
                  -File
          )

          if ($exes.Count -eq 0) {
              throw "Release 目录中没有找到任何 EXE"
          }

          # 优先寻找项目主程序
          $exe = $exes |
              Where-Object {
                  $_.Name -eq "OsEasy_Cloud_ToolBox.exe"
              } |
              Select-Object -First 1

          # 如果没有找到指定名称，则使用第一个 EXE
          if (-not $exe) {
              Write-Host ""
              Write-Host "未找到 OsEasy_Cloud_ToolBox.exe"
              Write-Host "将使用 Release 目录中的第一个 EXE："

              $exe = $exes | Select-Object -First 1
          }

          if (-not $exe) {
              throw "无法确定需要发布的 EXE"
          }

          Write-Host ""
          Write-Host "最终发布文件："
          Write-Host $exe.FullName
          Write-Host "文件大小：$($exe.Length) bytes"

          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      # ========================================
      # 7. 获取上一个版本 Tag
      # ========================================
      - name: Find previous tag
        if: steps.release.outputs.is_release == 'true'
        id: previous
        shell: pwsh
        run: |
          git fetch --tags --force

          $currentTag = "${{ steps.release.outputs.tag }}"

          # 获取所有 vX.X.X.X 格式的 Tag
          $tags = @(
              git tag --list "v*" --sort=-v:refname |
              Where-Object {
                  $_ -ne $currentTag
              }
          )

          if ($tags.Count -gt 0) {
              $previousTag = $tags[0]

              Write-Host "当前版本：$currentTag"
              Write-Host "上一个版本：$previousTag"

              "tag=$previousTag" >> $env:GITHUB_OUTPUT
          }
          else {
              Write-Host "没有找到历史版本 Tag。"

              "tag=" >> $env:GITHUB_OUTPUT
          }

      # ========================================
      # 8. 提交 AssemblyInfo 版本修改
      # ========================================
      - name: Commit version change
        if: steps.release.outputs.is_release == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add OsEasy_Cloud_ToolBox/Properties/AssemblyInfo.cs

          if (git diff --cached --quiet) {
              Write-Host "AssemblyInfo.cs 没有变化，不需要提交。"
          }
          else {
              git commit -m "chore: set version $env:VERSION"

              if ($LASTEXITCODE -ne 0) {
                  throw "版本号 Commit 失败"
              }

              git push origin HEAD:${{ github.ref_name }}

              if ($LASTEXITCODE -ne 0) {
                  throw "版本号 Commit Push 失败"
              }

              Write-Host ""
              Write-Host "版本号修改已提交："
              Write-Host "chore: set version $env:VERSION"
          }

      # ========================================
      # 9. 创建 Git Tag
      # ========================================
      - name: Create tag
        if: steps.release.outputs.is_release == 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # 检查 Tag 是否已经存在
          git fetch --tags --force

          $existingTag = git tag --list "$env:TAG"

          if ($existingTag) {
              throw "Tag $env:TAG 已经存在，停止发布以避免覆盖已有 Release。"
          }

          Write-Host "创建 Tag：$env:TAG"

          git tag -a "$env:TAG" -m "Release $env:TAG"

          if ($LASTEXITCODE -ne 0) {
              throw "创建 Tag 失败"
          }

          git push origin "$env:TAG"

          if ($LASTEXITCODE -ne 0) {
              throw "Push Tag 失败"
          }

          Write-Host "Tag 创建成功：$env:TAG"

      # ========================================
      # 10. 生成 Release Notes
      # ========================================
      - name: Generate release notes
        if: steps.release.outputs.is_release == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_TAG)) {

              $notes = @"
          **Full Changelog**: [v$env:VERSION](https://github.com/$env:REPOSITORY/commits/$env:TAG)
          "@

          }
          else {

              $notes = @"
          **Full Changelog**: [$env:PREVIOUS_TAG...$env:TAG](https://github.com/$env:REPOSITORY/compare/$env:PREVIOUS_TAG...$env:TAG)
          "@

          }

          $notes | Set-Content `
              -Path release-notes.md `
              -Encoding UTF8

          Write-Host ""
          Write-Host "Release Notes："
          Write-Host $notes

      # ========================================
      # 11. 创建 GitHub Release + 上传 EXE
      # ========================================
      - name: Create GitHub Release
        if: steps.release.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body_path: release-notes.md
          files: ${{ steps.exe.outputs.path }}
          generate_release_notes: falsename: Build and Release

