name: Build and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    name: Build Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release commit
        id: release
        shell: pwsh
        run: |
          $commitMessage = @"
          ${{ github.event.head_commit.message }}
          "@

          Write-Host "Commit message:"
          Write-Host $commitMessage

          $match = [regex]::Match(
              $commitMessage,
              '(?im)release:\s*v(\d+\.\d+\.\d+\.\d+)'
          )

          if (-not $match.Success) {
              Write-Host "Commit 不包含 release: vx.x.x.x"
              Write-Host "跳过 Release。"

              "is_release=false" >> $env:GITHUB_OUTPUT
              exit 0
          }

          $version = $match.Groups[1].Value
          $tag = "v$version"

          Write-Host "检测到 Release："
          Write-Host "Version = $version"
          Write-Host "Tag     = $tag"

          "is_release=true" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Update AssemblyInfo version
        if: steps.release.outputs.is_release == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $file = "OsEasy_Cloud_ToolBox/Properties/AssemblyInfo.cs"
          $version = $env:VERSION

          if (-not (Test-Path $file)) {
              throw "找不到 $file"
          }

          Write-Host "修改版本号为 $version"

          $content = Get-Content $file -Raw

          $content = $content -replace `
              '\[assembly:\s*AssemblyVersion\(".*?"\)\]', `
              "[assembly: AssemblyVersion(`"$version`")]"

          $content = $content -replace `
              '\[assembly:\s*AssemblyFileVersion\(".*?"\)\]', `
              "[assembly: AssemblyFileVersion(`"$version`")]"

          Set-Content `
              -Path $file `
              -Value $content `
              -Encoding UTF8

          Write-Host ""
          Write-Host "修改后的版本信息："

          Select-String `
              -Path $file `
              -Pattern 'AssemblyVersion|AssemblyFileVersion'

      - name: Setup MSBuild
        if: steps.release.outputs.is_release == 'true'
        uses: microsoft/setup-msbuild@v3

      - name: Build Release
        if: steps.release.outputs.is_release == 'true'
        shell: pwsh
        run: |
          Write-Host "开始构建 Release | Any CPU..."

          $msbuildArgs = @(
              "OsEasy_Cloud_ToolBox.sln"
              "/m"
              "/p:Configuration=Release"
              "/p:Platform=Any CPU"
          )

          & msbuild @msbuildArgs

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild 构建失败"
          }

          Write-Host ""
          Write-Host "MSBuild 构建成功。"

      - name: Locate executable
        if: steps.release.outputs.is_release == 'true'
        id: exe
        shell: pwsh
        run: |
          $releaseDir = "OsEasy_Cloud_ToolBox/bin/Release"

          if (-not (Test-Path $releaseDir)) {
              throw "Release 目录不存在：$releaseDir"
          }

          Write-Host "Release 目录：$releaseDir"
          Write-Host ""
          Write-Host "Release 目录内容："

          Get-ChildItem `
              $releaseDir `
              -Recurse `
              -File |
              Select-Object FullName, Length

          $exes = @(
              Get-ChildItem `
                  $releaseDir `
                  -Filter "*.exe" `
                  -Recurse `
                  -File
          )

          if ($exes.Count -eq 0) {
              throw "Release 目录中没有找到任何 EXE"
          }

          # 优先寻找项目主程序
          $exe = $exes |
              Where-Object {
                  $_.Name -eq "OsEasy_Cloud_ToolBox.exe"
              } |
              Select-Object -First 1

          # 如果没找到，则使用第一个 EXE
          if (-not $exe) {
              Write-Host ""
              Write-Host "未找到 OsEasy_Cloud_ToolBox.exe"
              Write-Host "将使用 Release 目录中的第一个 EXE："

              $exe = $exes | Select-Object -First 1
          }

          if (-not $exe) {
              throw "无法确定需要发布的 EXE"
          }

          Write-Host ""
          Write-Host "最终发布文件："
          Write-Host $exe.FullName
          Write-Host "文件大小：$($exe.Length) bytes"

          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      # ============================================================
      # 上传 EXE 到 S3
      # ============================================================
      - name: Upload EXE to S3
        if: steps.release.outputs.is_release == 'true'
        shell: pwsh
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          EXE_PATH: ${{ steps.exe.outputs.path }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:S3_ENDPOINT)) {
              throw "GitHub Secret S3_ENDPOINT 未配置"
          }

          if ([string]::IsNullOrWhiteSpace($env:S3_BUCKET)) {
              throw "GitHub Secret S3_BUCKET 未配置"
          }

          if ([string]::IsNullOrWhiteSpace($env:AWS_ACCESS_KEY_ID)) {
              throw "GitHub Secret S3_ACCESS_KEY 未配置"
          }

          if ([string]::IsNullOrWhiteSpace($env:AWS_SECRET_ACCESS_KEY)) {
              throw "GitHub Secret S3_SECRET_KEY 未配置"
          }

          if (-not (Test-Path $env:EXE_PATH)) {
              throw "EXE 不存在：$env:EXE_PATH"
          }

          Write-Host "AWS CLI："
          aws --version

          $objectKey = "OsEasy_Cloud_ToolBox.exe"
          $s3Uri = "s3://$env:S3_BUCKET/$objectKey"

          Write-Host ""
          Write-Host "开始上传 EXE 到 S3..."
          Write-Host "Endpoint: $env:S3_ENDPOINT"
          Write-Host "Bucket:   $env:S3_BUCKET"
          Write-Host "Object:   $objectKey"
          Write-Host "File:     $env:EXE_PATH"

          aws s3 cp `
              "$env:EXE_PATH" `
              "$s3Uri" `
              --endpoint-url "$env:S3_ENDPOINT" `
              --only-show-errors

          if ($LASTEXITCODE -ne 0) {
              throw "S3 上传失败"
          }

          Write-Host ""
          Write-Host "S3 上传成功：$s3Uri"

      - name: Find previous tag
        if: steps.release.outputs.is_release == 'true'
        id: previous
        shell: pwsh
        run: |
          git fetch --tags --force

          $currentTag = "${{ steps.release.outputs.tag }}"

          $tags = @(
              git tag --list "v*" --sort=-v:refname |
              Where-Object {
                  $_ -ne $currentTag
              }
          )

          if ($tags.Count -gt 0) {
              $previousTag = $tags[0]

              Write-Host "当前版本：$currentTag"
              Write-Host "上一个版本：$previousTag"

              "tag=$previousTag" >> $env:GITHUB_OUTPUT
          }
          else {
              Write-Host "没有找到历史版本 Tag."

              "tag=" >> $env:GITHUB_OUTPUT
          }

      - name: Commit version change
        if: steps.release.outputs.is_release == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add OsEasy_Cloud_ToolBox/Properties/AssemblyInfo.cs

          if (git diff --cached --quiet) {
              Write-Host "AssemblyInfo.cs 没有变化，不需要提交。"
          }
          else {
              git commit -m "chore: set version $env:VERSION"

              if ($LASTEXITCODE -ne 0) {
                  throw "版本号 Commit 失败"
              }

              git push origin HEAD:${{ github.ref_name }}

              if ($LASTEXITCODE -ne 0) {
                  throw "版本号 Commit Push 失败"
              }

              Write-Host ""
              Write-Host "版本号修改已提交："
              Write-Host "chore: set version $env:VERSION"
          }

      - name: Create tag
        if: steps.release.outputs.is_release == 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --tags --force

          $existingTag = git tag --list "$env:TAG"

          if ($existingTag) {
              throw "Tag $env:TAG 已经存在，停止发布以避免覆盖已有 Release。"
          }

          Write-Host "创建 Tag：$env:TAG"

          git tag -a "$env:TAG" -m "Release $env:TAG"

          if ($LASTEXITCODE -ne 0) {
              throw "创建 Tag 失败"
          }

          git push origin "$env:TAG"

          if ($LASTEXITCODE -ne 0) {
              throw "Push Tag 失败"
          }

          Write-Host "Tag 创建成功：$env:TAG"

      - name: Generate release notes
        id: notes
        if: steps.release.outputs.is_release == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $currentTag = $env:TAG
          $previousTag = $env:PREVIOUS_TAG
          $repository = $env:REPOSITORY

          Write-Host "生成 Release Notes..."
          Write-Host "当前 Tag：$currentTag"
          Write-Host "上一 Tag：$(if ($previousTag) { $previousTag } else { '(无)' })"

          if ($previousTag) {
              $logRange = "$previousTag..$currentTag"
          } else {
              $logRange = $currentTag
          }

          # 按提交时间倒序：最新提交在前
          $commits = @(git log $logRange --pretty=format:"%H%x09%s")

          $lines = @()

          foreach ($commit in $commits) {
              if ([string]::IsNullOrWhiteSpace($commit)) {
                  continue
              }

              $parts = $commit -split "`t", 2

              if ($parts.Count -lt 2) {
                  continue
              }

              $fullHash = $parts[0]
              $subject = $parts[1]

              # 隐藏 GitHub Actions 自动生成的版本号 Commit
              if ($subject -match '^chore:\s*set version\s+\d+\.\d+\.\d+\.\d+$') {
                  Write-Host "隐藏自动版本 Commit：$fullHash $subject"
                  continue
              }

              $shortHash = $fullHash.Substring(0, 7)
              $commitUrl = "https://github.com/$repository/commit/$fullHash"

              $lines += "- $subject（[$shortHash]($commitUrl)）"
          }

          if ($lines.Count -eq 0) {
              $lines += "- 无可展示的提交记录"
          }

          # Full Changelog
          if ($previousTag) {
              $compareUrl = "https://github.com/$repository/compare/$previousTag...$currentTag"
          } else {
              $compareUrl = "https://github.com/$repository/commits/$currentTag"
          }

          $lines += ""
          $lines += "**Full Changelog**: [$previousTag...$currentTag]($compareUrl)"

          $releaseNotes = $lines -join "`n"

          Write-Host ""
          Write-Host "========== Release Notes =========="
          Write-Host $releaseNotes
          Write-Host "==================================="
          Write-Host ""

          # 写入 GitHub Actions Output
          "body<<EOF" >> $env:GITHUB_OUTPUT
          $releaseNotes >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.release.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          files: ${{ steps.exe.outputs.path }}

